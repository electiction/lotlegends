<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตั้งรหัสผ่านใหม่ · The Lot Legends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page--app">
  <header class="nav">
    <div class="nav__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark">L</span>
        <span class="brand__text">The Lot Legends</span>
      </a>
      <nav class="nav__links">
        <a href="login.html">เข้าสู่ระบบ</a>
      </nav>
    </div>
  </header>

  <section class="auth">
    <div class="container auth__wrap">
      <div class="card-panel auth__panel">
        <p class="eyebrow">— Reset</p>
        <h1 class="h2 auth__title">รหัส<br/><em>ผ่านใหม่</em></h1>
        <p class="muted auth__sub" id="no-token" hidden>ลิงก์ไม่ถูกต้อง หรือลิงก์หมดอายุ — ขอลิงก์ใหม่จาก <a href="forgot.html">ลืมรหัสผ่าน</a></p>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="r-pw">รหัสผ่านใหม่</label>
            <input id="r-pw" type="password" minlength="8" required autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว" />
          </div>
          <div class="field">
            <label for="r-pw2">ยืนยันรหัสผ่าน</label>
            <input id="r-pw2" type="password" minlength="8" required autocomplete="new-password" />
          </div>
          <p class="form__error" id="reset-error" hidden></p>
          <div class="form__actions form__actions--single">
            <button type="submit" class="btn btn--gold btn--lg" id="reset-btn">บันทึกรหัสใหม่</button>
          </div>
        </form>

        <p class="auth__alt muted small" id="reset-done" hidden>ตั้งรหัสสำเร็จ — กำลังพาไปหน้าเข้าสู่ระบบ…</p>
        <p class="auth__alt muted small" id="reset-foot"><a href="login.html">← เข้าสู่ระบบ</a></p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__bottom">
      <small>© 2026 The Lot Legends</small>
    </div>
  </footer>

  <script src="api.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const noTok = document.getElementById('no-token');
      const form  = document.getElementById('reset-form');
      const err   = document.getElementById('reset-error');
      const done  = document.getElementById('reset-done');
      const foot  = document.getElementById('reset-foot');
      const btn   = document.getElementById('reset-btn');

      if (!token || token.length < 20) {
        noTok.hidden = false;
        form.style.display = 'none';
        if (foot) foot.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        const a = document.getElementById('r-pw').value;
        const b = document.getElementById('r-pw2').value;
        if (a.length < 8) {
          err.textContent = 'รหัสต้องมีอย่างน้อย 8 ตัว';
          err.hidden = false;
          return;
        }
        if (a !== b) {
          err.textContent = 'รหัสยืนยันไม่ตรงกัน';
          err.hidden = false;
          return;
        }
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
        try {
          await window.LotLegends.resetPassword(token, a);
          form.style.display = 'none';
          foot.style.display = 'none';
          done.hidden = false;
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } catch (ex) {
          err.textContent = ex.message || 'ตั้งรหัสไม่สำเร็จ';
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = 'บันทึกรหัสใหม่';
        }
      });
    })();
  </script>
</body>
</html>
