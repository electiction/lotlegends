# Render Blueprint — one-click deploy.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. On https://render.com → "New" → "Blueprint" → connect the repo.
#   3. Render reads this file and provisions BOTH services below:
#         · the Postgres database
#         · the FastAPI web service
#      The Postgres URL is auto-injected into DATABASE_URL.
#   4. After the first deploy, set the bootstrap-admin password (Marked as
#      `sync: false` so Render asks you to fill it in interactively).
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: lotlegends-db
    plan: free
    region: singapore     # MUST match the web service region — Render's internal
                          # hostname (dpg-xxx-a) only resolves within the same region.
    databaseName: lotlegends
    user: lotlegends

services:
  - type: web
    name: lotlegends
    runtime: python
    plan: free
    region: singapore     # closest to Thailand on the free tier
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LOTLEGENDS_ENV
        value: production
      - key: LOTLEGENDS_SECRET
        generateValue: true        # Render auto-generates a 32+ char secret
      - key: DATABASE_URL
        fromDatabase:
          name: lotlegends-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false                # prompts on first deploy
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false                # prompts on first deploy
      - key: BOOTSTRAP_ADMIN_NAME
        value: Admin
      - key: PYTHON_VERSION
        value: "3.12.6"
